<div id="title"><div><h1>ドライブシミュレーター</h1><p>街・海・山・空を自由に走る、飛ぶ、潜る。<br>車も天気も重力も、メニューで自由に変えられます。</p><p>左: ハンドル／右: アクセルとブレーキ<br>画面ドラッグ: カメラ／☰: 車・マップ・設定</p><button id="bStart">はじめる</button></div></div>

<script>
(()=>{'use strict';
/* ===== core ===== */

 clouds:true,invincible:false,allfly:false,alldive:true,allgun:true,shadows:true,sound:true,surface:0,tod:0,weather:0,quality:2,brake:1,assist:.4,tilt:false,tiltSens:1,tiltInv:false,auto:true,react:true,police:true,spdlines:true,filmic:true,laserCol:0xff2a2a};

 real:{gravity:9.8,speed:1,power:1,grip:1,steer:1,mass:1,size:1,bounce:.12,wind:0,blast:1,timescale:1,invincible:false,allfly:false},

};

function addBox(g,w,h,l,cx,cy,cz,col,tile,cell){
 const hs=[w/2,h/2,l/2],c=new THREE.Color(col);
 for(let fi=0;fi<6;fi++){
  const nn=FACES[fi][0],uu=FACES[fi][1],vv=FACES[fi][2];
  const Hn=Math.abs(nn[0])*hs[0]+Math.abs(nn[1])*hs[1]+Math.abs(nn[2])*hs[2];
  const Hu=Math.abs(uu[0])*hs[0]+Math.abs(uu[1])*hs[1]+Math.abs(uu[2])*hs[2];
  const Hv=Math.abs(vv[0])*hs[0]+Math.abs(vv[1])*hs[1]+Math.abs(vv[2])*hs[2];
  const nu=cell?Math.max(1,Math.ceil(2*Hu/cell)):1,nv=cell?Math.max(1,Math.ceil(2*Hv/cell)):1;
  const side=tile&&Math.abs(nn[1])<.5;
  const us=side?Math.max(1,Math.round(2*Hu/3.5))/4:0,vs=side?Math.max(1,Math.round(2*Hv/3.5))/4:0;
  const base=g.p.length/3;
  for(let j=0;j<=nv;j++)for(let i=0;i<=nu;i++){
   const su=-1+2*i/nu,sv=-1+2*j/nv;
   const py=cy+nn[1]*Hn+uu[1]*Hu*su+vv[1]*Hv*sv;
   g.p.push(cx+nn[0]*Hn+uu[0]*Hu*su+vv[0]*Hv*sv,py,cz+nn[2]*Hn+uu[2]*Hu*su+vv[2]*Hv*sv);
   let ao=1;if(tile&&h>8&&Math.abs(nn[1])<.5){const t=Math.min(1,Math.max(0,(py-(cy-h/2))/16));ao=.56+.44*t*(2-t);}
   g.n.push(nn[0],nn[1],nn[2]);g.c.push(c.r*ao,c.g*ao,c.b*ao);
   if(side)g.u.push(tile.ou+i/nu*us,tile.ov+j/nv*vs);else g.u.push(.02,.02);
  }
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=base+j*(nu+1)+i,b=a+1,c2=a+nu+1,d=c2+1;g.i.push(a,b,d,a,d,c2);}
 }
}

 {const nx=T.x+T.vx*dt,nz=T.z+T.vz*dt,hn=W.h(nx,nz);if(W.water&&hn<WL+.3){T.speed*=.5;T.yaw+=dt*2;}else{T.x=nx;T.z=nz;}}

function driveXZ(dt,o){
 const sp=P.spec;
 const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
 let vf=P.vx*sy+P.vz*cy;const vl=P.vx*cy-P.vz*sy;
 const bo=P.boost;
 const vmax=sp.vmax*S.speed*o.vm*(bo?1.45:1)*(sp.t==='rocket'&&bo?1.6:1);
 const acc=sp.acc*S.power*o.am*(bo?(sp.t==='rocket'?4:2.4):1)*(sp.jet?Math.max(.1,P.jetThr||0):1);
 let a=0;
 if(P.throttle){if(vf>=-.5)a+=acc*Math.max(0,1-(vf/vmax)*(vf/vmax));else a+=sp.brk*o.gm;}
 if(P.brake){if(vf>.7)a-=sp.brk*S.brake*Math.min(1.6,o.gm*1.1);else a-=acc*.55*Math.max(0,1-Math.pow(vf/(-vmax*.3),2));}
 a-=sp.acc/(vmax*vmax)*.12*vf*Math.abs(vf);
 if(Math.abs(vf)>.2)a-=Math.sign(vf)*(o.roll+(P.throttle||P.brake?0:.4));else if(!P.throttle&&!P.brake)vf*=.9;
 vf+=a*dt;
 const G=Math.max(S.gravity,6),eff=G*sp.grip/7*S.grip*o.gm;
 let yr;
 if(sp.t==='tank')yr=-P.steer*1.15*S.steer;
 else{
  const ang=P.steer*sp.steer*S.steer*1.25/(1+Math.pow(Math.abs(vf)/45,2)),wb=Math.max(2,sp.L*.6);
  yr=-(vf*Math.tan(ang))/wb;
  const lim=eff*o.lm*(P.hand?2.2:1)/Math.max(Math.abs(vf),3);
  yr=clamp(yr,-lim,lim);
 }
 P.wy+=(yr-P.wy)*Math.min(1,dt*10);
 const wx=vf*sy+vl*cy,wz=vf*cy-vl*sy;
 P.yaw+=P.wy*dt;
 const sy2=Math.sin(P.yaw),cy2=Math.cos(P.yaw);
 let f2=wx*sy2+wz*cy2,l2=wx*cy2-wz*sy2;
 const slip=Math.abs(l2)/(Math.abs(f2)+4);
 const k=sp.grip*S.grip*o.gm*(P.hand?.16:1)*(slip>.5?.65:1)*(sp.t==='tank'?2:1)*o.lk;
 const ln=l2*Math.exp(-k*dt),lost=l2-ln;l2=ln;
 f2-=(f2>=0?1:-1)*Math.min(Math.abs(f2),Math.abs(lost)*.03);
 if(P.hand)f2*=Math.exp(-.35*dt);
 P.vx=f2*sy2+l2*cy2;P.vz=f2*cy2-l2*sy2;P.vf=f2;P.slip=slip;P.ax+=(a-P.ax)*Math.min(1,dt*6);
 if(S.assist>0&&sp.t!=='tank'&&Math.abs(f2)>8){
  const sp2=Math.hypot(P.vx,P.vz);
  if(!P.hand&&slip>.22&&sp2>5)P.yaw+=angDiff(P.yaw,Math.atan2(P.vx,P.vz))*Math.min(1,S.assist*dt*1.8);
  else if(P.hand)P.wy+=-P.steer*S.assist*dt*1.6;
 }
 if(S.wind>0){const k2=S.wind*.12*dt/Math.sqrt(sp.mass/1400);P.vx+=k2*.8;P.vz+=k2*.6;}
}

function stepGround(dt){

 if(P.grounded){
  const gx=(hAt(P.x+1,P.z)-hAt(P.x-1,P.z))/2,gz=(hAt(P.x,P.z+1)-hAt(P.x,P.z-1))/2;
  P.vx-=S.gravity*gx*dt*.9;P.vz-=S.gravity*gz*dt*.9;
  driveXZ(dt,{vm:land,am:Math.max(.4,land),gm:surf*(W.grip?W.grip(P.x,P.z):1),roll:.25,lk:1,lm:1.9});
 }else{

  if(S.wind>0){const k2=S.wind*.2*dt/Math.sqrt(sp.mass/1400);P.vx+=k2*.8;P.vz+=k2*.6;}
 }
 let nx=P.x+P.vx*dt,nz=P.z+P.vz*dt;
 const g2=hAt(nx,nz);

  const gxx=hAt(nx+1.5,nz)-hAt(nx-1.5,nz),gzz=hAt(nx,nz+1.5)-hAt(nx,nz-1.5),gl=Math.hypot(gxx,gzz)||1,wnx=-gxx/gl,wnz=-gzz/gl;

 }

 if(P.grounded){
  const yff=P.y+P.vy*dt-.5*S.gravity*dt*dt;

  else{P.vy=clamp((g-P.y)/dt,-40,28);P.y=g;}
 }else{
  P.vy-=S.gravity*dt;P.y+=P.vy*dt;
  const deep=W.water&&g<WL-.6,sY=deep?WL:g;
  if(P.y<=sY){
   if(deep){const imp=-P.vy;P.surf=true;P.grounded=false;P.y=WL;P.vy=0;splash(P.x,WL,P.z,Math.min(30,10+imp),1.2*sz);noise(.5,900,1);if(imp>26)hurtPlayer((imp-26)*1.2/sp.armor);}
   else{
    const imp=-P.vy;P.y=sY;
    if(imp>14*(sp.t==='monster'?1.7:1))hurtPlayer((imp-14)*1.8/sp.armor);
    if(imp>3)thud(imp*.6);
    const bnc=Math.max(S.bounce,sp.bounce||0);P.vy=imp>2?imp*bnc:0;
    if(P.vy<1.5){P.vy=0;P.grounded=true;}
   }
  }
 }
 /* attitude */
 if(P.grounded){
  const d=1.6*sz,sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
  const hF=hAt(P.x+sy*d,P.z+cy*d),hB=hAt(P.x-sy*d,P.z-cy*d),hL=hAt(P.x+cy*d*.6,P.z-sy*d*.6),hR=hAt(P.x-cy*d*.6,P.z+sy*d*.6);
  leanTo(dt,clamp(Math.atan2(hB-hF,2*d),-.6,.6),clamp(Math.atan2(hL-hR,1.2*d)+clamp(P.wy*P.vf*.004*(P.spec.t==='bike'?4:1),P.spec.t==='bike'?-.5:-.1,P.spec.t==='bike'?.5:.1),-.6,.6),12);
 }else leanTo(dt,-clamp(Math.atan2(P.vy,Math.hypot(P.vx,P.vz)+1),-.7,.7),0,3);
}

function stepJet(dt){
 const sp=P.spec;
 if(!P.jfly){P.jfly=true;const hv=Math.hypot(P.vx,P.vz);P.jv=Math.max(Math.hypot(hv,P.vy),45*(sp.jk||1));P.jp=clamp(Math.atan2(P.vy,hv),-1.4,1.4);}
 const vmax=Math.max(sp.vmax*1.2,70)*S.speed,acc=Math.max(sp.acc*1.3,10)*S.power;
 let v=P.jv;
 /* pitch control: stick down = climb, stick up = dive; reaches vertical */
 let u=clamp((INP.up?1:0)-(INP.down?1:0)+(AP.u!==null?0:-JS.y),-1,1);
 const jk=sp.jk||1,pr=1.25*(.45+.55*clamp(v/(70*jk),0,1));
 if(AP.u!==null){const tp=clamp(AP.u*.9,-1.2,1.2);P.jp+=clamp(tp-P.jp,-1.6*dt,1.6*dt);}
 else if(P.autoLand){const al=P.y-hAt(P.x,P.z),tp=-clamp(al*.012,.04,.28)+(al<6?.1:0);P.jp+=clamp(tp-P.jp,-.9*dt,.9*dt);if(INP.up||INP.down||Math.abs(JS.y)>.2)P.autoLand=false;}

/* hover-capable space craft: float up gently, then free altitude, stay in the air at throttle 0 */
function stepHover(dt){

 let vyT=inU*(50+vm*.12)*(W.deep?2.2:1)*(1+.7*Math.min(1,P.vh/1.1))*.6*(1-.7*Math.min(1,Math.abs(vf)/200))+vf*Math.sin(P.hpit);

 const h=hAt(P.x,P.z),deep=W.water&&h<WL,sY=deep?WL:h;
 if(P.y<sY+.1){P.y=sY+.1;if(P.vy<0)P.vy=0;
  if((INP.down&&!INP.up&&Math.abs(vf)<60)||(P.autoLand&&Math.abs(vf)<40)){P.autoLand=false;P.flying=false;P.vy=0;if(deep&&h<WL-.6){P.surf=true;P.y=WL;splash(P.x,WL,P.z,14,1.2);}else{P.grounded=true;P.y=sY;}toast('着陸');}}

}

/* tilt control */
function enableTilt(){
 const go=()=>{window.addEventListener('deviceorientation',tiltEv);tiltOn=true;toast('傾き操作オン：スマホを左右に傾けて曲がる');};
 try{if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')go();else{S.tilt=false;toast('傾きセンサーの許可が必要です');}}).catch(()=>{S.tilt=false;});}else go();}catch(e){S.tilt=false;}
}
function tiltEv(e){
 if(e.beta===null&&e.gamma===null)return;
 const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(window.orientation||0);
 TILT=a===90?e.beta:(a===270||a===-90)?-e.beta:a===180?-e.gamma:e.gamma;TILT=TILT||0;
}
if(S.tilt)try{if(typeof DeviceOrientationEvent==='undefined'||typeof DeviceOrientationEvent.requestPermission!=='function')enableTilt();else S.tilt=false;}catch(e){}
